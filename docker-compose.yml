# Local development stack for the Beezents backend.
#
# Purpose: convenience for running the API + PostgreSQL together with one
# command (`docker compose up --build`). This is NOT a production topology:
# in production PostgreSQL is external/managed and the API image is deployed
# with environment-provided configuration.
#
# Note: the host PostgreSQL port is mapped to 5433 to avoid clashing with a
# local PostgreSQL already running on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beezents
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beezents"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/beezents
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: beezents_session
      SESSION_MAX_AGE_SECONDS: "604800"
      STORAGE_BACKEND: local
      MEDIA_ROOT: /app/media
      MEDIA_MAX_SIZE_BYTES: "10485760"
      MEDIA_MAX_VIDEO_SIZE_BYTES: "104857600"
      # Frontend integration (Phase 12): allow the Next.js dev origin.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      TRUSTED_HOSTS: "localhost,127.0.0.1,192.168.0.109"
      # Dev seed admin (testing only): auto-create an admin on startup.
      SEED_DEV_ADMIN: "true"
      SEED_ADMIN_EMAIL: "MBadmin@beezents.com"
      SEED_ADMIN_PASSWORD: "Bee@MB"
      SEED_ADMIN_FULL_NAME: "Beezents Admin"
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media-data: